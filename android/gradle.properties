org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on a different drive letter than the Gradle/Kotlin
# caches (pub cache, Android SDK). Kotlin's incremental compiler tries to
# compute a relative path between the two drive roots and crashes with
# "this and base files have different roots" / "Could not close
# incremental caches" — disabling incremental compilation avoids it
# (build-speed-only setting, harmless to disable). See wardro-app-gotchas.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
