name: fixedwise_app
description: "FixedWise — a private, offline fixed deposit tracker and maturity calculator for India."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.1+2004

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  file_picker: ^12.1.3
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Config for `dart run flutter_launcher_icons` — regenerates every mipmap
# density under android/app/src/main/res/ (both the legacy square icon
# and the adaptive foreground/background layers) and the iOS AppIcon set,
# from the source images in assets/icon/. Those came from a full icon
# export package (see assets/icon/README in that Downloads folder, not
# copied into the repo) that also included a hand-written
# android/adaptive/ic_launcher.xml using a flat #101a2e background color
# rather than a background image — adaptive_icon_background below matches
# that exactly rather than pointing at a second bitmap layer.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  # Android's pre-8.0 fallback icon needs the rounded-square shape baked
  # in (what launchers on those versions expect); the flat, unrounded
  # `image_path` above is right for iOS (which applies its own squircle
  # mask) but would look wrong as Android's legacy icon.
  image_path_android: "assets/icon/app_icon_android_legacy.png"
  adaptive_icon_background: "#101a2e"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The supplied foreground is already inset to Android's adaptive-icon
  # safe zone (per the export's own README) — flutter_launcher_icons
  # defaults to an extra 16% inset on top of whatever it's given, which
  # would shrink an already-safe-zoned mark twice over.
  adaptive_icon_foreground_inset: 0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # assets/icon/ and assets/branding/ are source art for
  # flutter_launcher_icons and store listings only — never read at
  # runtime, so they aren't bundled into the APK.
  assets:
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/IBMPlexSans-OFL.txt

  # Bundled rather than fetched at runtime (the old `google_fonts` setup) —
  # the app has no INTERNET permission, and F-Droid treats runtime calls
  # to Google's servers as a tracking anti-feature. Static instances cut
  # from the OFL variable fonts in github.com/google/fonts at exactly the
  # weights `AppTypography` uses.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500

